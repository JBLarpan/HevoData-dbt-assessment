version: 2

sources:
  - name: hevo_source
    description: Raw tables loaded by Hevo pipeline from PostgreSQL
    database: "{{ target.database }}"
    schema: "{{ target.schema }}"
    tables:
      - name: postgres_raw_customers
        description: Raw customer records from PostgreSQL
        columns:
          - name: id
            description: Primary key
            tests:
              - unique
              - not_null
          - name: first_name
            tests:
              - not_null
          - name: last_name
            tests:
              - not_null

      - name: postgres_raw_orders
        description: Raw order records from PostgreSQL
        columns:
          - name: id
            description: Primary key
            tests:
              - unique
              - not_null
          - name: user_id
            tests:
              - not_null
          - name: status
            tests:
              - not_null
              - accepted_values:
                  values: ['completed', 'returned', 'return_pending', 'placed', 'shipped']

      - name: postgres_raw_payments
        description: Raw payment records from PostgreSQL
        columns:
          - name: id
            description: Primary key
            tests:
              - unique
              - not_null
          - name: payment_method
            tests:
              - accepted_values:
                  values: ['credit_card', 'coupon', 'bank_transfer', 'gift_card']
